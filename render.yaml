services:
  - type: web
    name: ip-generator
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: OPENAI_API_KEY
        value: ""
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4-turbo
      - key: OPENAI_MAX_TOKENS
        value: 2000
      - key: OPENAI_TEMPERATURE
        value: 0.7
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE
        value: 10485760
      - key: LOG_LEVEL
        value: INFO
